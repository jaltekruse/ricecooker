<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">readline(n)</code></td>
<td class="l m b0 r0 l0 t0 lines"><code class="code-inline tex2jax_ignore">filevar.readline()</code></td>
